
name: Run PHP Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Pruebas de Laravel
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v2

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2.6'
          extensions: mbstring, xml,
          coverage: none
          tools: composer:v2

      - name: Guardar caché de Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Instalar dependencias PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Configurar archivo de entorno
        run: cp .env.example .env

      - name: Generar clave de Laravel
        run: php artisan key:generate

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias de Node
        run: npm ci

      - name: Compilar archivos de Vite
        run: npm run build

      - name: Ejecutar pruebas Feature
        run: vendor/bin/phpunit --testsuite Feature
