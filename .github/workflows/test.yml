
name: Run PHP Tests

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar entorno PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2.6'
          extensions: mbstring, xml
          coverage: none

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-scripts --no-progress --no-suggest

      - name: Copiar archivo .env.example a .env
        run: cp .env.example .env

      - name: Generar clave de aplicación
        run: php artisan key:generate

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias de Node
        run: npm ci

      - name: Compilar assets de Vite
        run: npm run build

      - name: Ejecutar pruebas
        run: vendor/bin/phpunit --testsuite Feature
